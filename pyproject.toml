[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfunc-dynamics"
version = "0.1.0"
description = "Dynamical invariants of L-function zeros and Coulomb chains"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "scikit-learn>=1.3",
    "pandas>=2.0"
]

[project.optional-dependencies]
dev = ["pytest", "flake8"]
